name: appointment-crm

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${APPOINTMENTCRM_POSTGRES_DB:-appointment_crm}
      POSTGRES_USER: ${APPOINTMENTCRM_POSTGRES_USER:-appointment_crm}
      POSTGRES_PASSWORD: ${APPOINTMENTCRM_POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${APPOINTMENTCRM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.8.1-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${APPOINTMENTCRM_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
      args:
        BUILD_CONFIGURATION: ${APPOINTMENTCRM_BUILD_CONFIGURATION:-Release}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres:-Host=postgres;Port=5432;Database=appointment_crm;Username=appointment_crm;Password=change-me-local-only}
      DemoSeed__Enabled: ${APPOINTMENTCRM_DEMO_SEED_ENABLED:-true}
      DemoSeed__Password: ${APPOINTMENTCRM_DEMO_PASSWORD:-Demo-local-2026!}
      DataProtection__UseEphemeralKeys: "true"
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Critical
    command: ["--migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
      args:
        BUILD_CONFIGURATION: ${APPOINTMENTCRM_BUILD_CONFIGURATION:-Release}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres:-Host=postgres;Port=5432;Database=appointment_crm;Username=appointment_crm;Password=change-me-local-only}
      ConnectionStrings__Redis: redis:6379
      Cors__AllowedOrigins__0: http://localhost:${APPOINTMENTCRM_WEB_PORT:-5173}
      Identity__RequireSecureCookie: ${APPOINTMENTCRM_SECURE_COOKIE:-false}
      DataProtection__UseEphemeralKeys: "true"
    ports:
      - "${APPOINTMENTCRM_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    ports:
      - "${APPOINTMENTCRM_WEB_PORT:-5173}:8080"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
