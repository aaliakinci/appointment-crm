name: Quality

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: appointment_crm
          POSTGRES_USER: appointment_crm
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appointment_crm -d appointment_crm"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.8.1-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      APPOINTMENTCRM_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=appointment_crm;Username=appointment_crm;Password=ci-only-password
      APPOINTMENTCRM_TEST_REDIS: 127.0.0.1:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore AppointmentCrm.slnx --locked-mode --disable-parallel --verbosity minimal -m:1
      - run: dotnet list AppointmentCrm.slnx package --vulnerable --include-transitive
      - run: dotnet format AppointmentCrm.slnx --verify-no-changes --no-restore --verbosity minimal
      - run: dotnet build AppointmentCrm.slnx --configuration Release --no-restore --verbosity minimal -m:1
      - name: Domain and application unit gates
        run: dotnet test tests/AppointmentCrm.UnitTests/AppointmentCrm.UnitTests.csproj --configuration Release --no-build --no-restore --verbosity minimal -m:1
      - name: Release-blocking tenant, authorization, migration, concurrency, and journey gates
        run: dotnet test tests/AppointmentCrm.IntegrationTests/AppointmentCrm.IntegrationTests.csproj --configuration Release --no-build --no-restore --verbosity minimal -m:1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  browser-e2e:
    name: Browser E2E and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install locked browser test dependencies
        working-directory: src/web
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium runtime
        working-directory: src/web
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser journey, permission, error, responsive, and accessibility gates
        run: scripts/browser-e2e.sh

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
      - run: docker build --target quality --file deploy/web/Dockerfile .
      - run: docker build --file deploy/api/Dockerfile --tag appointment-crm-api:${{ github.sha }} .
      - run: docker build --file deploy/web/Dockerfile --tag appointment-crm-web:${{ github.sha }} .
      - run: docker build --file deploy/ops/Dockerfile --tag appointment-crm-ops:${{ github.sha }} .
      - run: scripts/verify-deployment.sh
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: appointment-crm-api:${{ github.sha }}
          format: table
          exit-code: "1"
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: appointment-crm-web:${{ github.sha }}
          format: table
          exit-code: "1"
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
      - name: Scan database operations image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: appointment-crm-ops:${{ github.sha }}
          format: table
          exit-code: "1"
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
      - run: scripts/container-smoke.sh
